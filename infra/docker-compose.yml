# Production-style stack: PostgreSQL + MinIO + API (serves the UI) + a separate training worker.
# Usage: cp .env.example .env (set JWT_SECRET, POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD), then
#        docker compose -f infra/docker-compose.yml --env-file .env up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: visentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: visentra
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U visentra"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-visentra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    depends_on: { db: { condition: service_healthy }, minio: { condition: service_started } }
    environment: &env
      VISENTRA_ENV: production
      DATABASE_URL: postgresql+psycopg://visentra:${POSTGRES_PASSWORD}@db:5432/visentra
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      STORAGE_BACKEND: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-visentra}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: visentra
      # analysis, reports and OCR run in the API process (there is no separate worker module in this build)
      WORKER_MODE: inline
      # session cookies are Secure (HTTPS only) in production; set COOKIE_SECURE=false only for a plain-HTTP local trial
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # trust X-Forwarded-For only from the TLS proxy in front (its address on the compose network); otherwise every
      # client shares the proxy's IP and the per-IP sign-in limit becomes one global limit
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS:-datasets-server.huggingface.co,huggingface.co,hf.co,cdn-lfs.huggingface.co,cdn-lfs.hf.co}
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s
# (27 Oct 2026) the former `worker` service ran `python -m visentra_api.worker`, a module that no longer exists: the
# container could only crash-loop. Removed; the API process does all work (WORKER_MODE=inline).
volumes: { pgdata: {}, miniodata: {}, appdata: {} }
