# Netlify hosts the static web frontend only. The FastAPI/PyTorch backend (apps/api, ml) is not deployable here.
# Building from apps/web keeps Netlify from auto-installing the root requirements.txt (torch, onnxruntime, `-e .`),
# which is what made the "Install dependencies" stage fail. apps/web/build.py uses only the Python standard library.
[build]
  base = "apps/web"
  command = "python3 build.py"
  publish = "dist"

# Client-side routes (e.g. /inspection/<id>) fall back to the single-page app, as the API server does locally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
